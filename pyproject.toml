[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prediction-arb-research"
version = "0.1.0"
description = "Read-only US prediction market arbitrage research starter"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
kalshi-ws = ["websockets==17.3", "cryptography==50.0.2"]

[project.scripts]
predarb = "predarb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
